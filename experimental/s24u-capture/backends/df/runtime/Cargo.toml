[package]
name = "clarifae-df-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "df"
crate-type = ["cdylib", "rlib"]

[dependencies]
df_core = { package = "deep_filter", path = "../pinned-libDF", default-features = false, features = ["tract"] }
ndarray = "=0.15.6"
sha2 = "=0.10.8"

[features]
allocation-metrics = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
strip = "debuginfo"
